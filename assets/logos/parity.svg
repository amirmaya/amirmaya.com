<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="orb" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#bfe9ff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="82%" stop-color="#0c3f7a"/>
      <stop offset="100%" stop-color="#041a33"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="40%" stop-color="#60c8ff"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="30%" stop-color="#ffd166"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1b8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#orb)"/>
  <!-- iris striations (eye-like radial lines) -->
  <g clip-path="url(#c)" stroke="#e0f2ff" stroke-width="0.7" opacity="0.35">
    <g transform="translate(32 32)">
      <path d="M0 -13 L0 -30"/><path d="M0 -13 L0 -30" transform="rotate(15)"/><path d="M0 -13 L0 -30" transform="rotate(30)"/><path d="M0 -13 L0 -30" transform="rotate(45)"/><path d="M0 -13 L0 -30" transform="rotate(60)"/><path d="M0 -13 L0 -30" transform="rotate(75)"/><path d="M0 -13 L0 -30" transform="rotate(90)"/><path d="M0 -13 L0 -30" transform="rotate(105)"/><path d="M0 -13 L0 -30" transform="rotate(120)"/><path d="M0 -13 L0 -30" transform="rotate(135)"/><path d="M0 -13 L0 -30" transform="rotate(150)"/><path d="M0 -13 L0 -30" transform="rotate(165)"/><path d="M0 -13 L0 -30" transform="rotate(180)"/><path d="M0 -13 L0 -30" transform="rotate(195)"/><path d="M0 -13 L0 -30" transform="rotate(210)"/><path d="M0 -13 L0 -30" transform="rotate(225)"/><path d="M0 -13 L0 -30" transform="rotate(240)"/><path d="M0 -13 L0 -30" transform="rotate(255)"/><path d="M0 -13 L0 -30" transform="rotate(270)"/><path d="M0 -13 L0 -30" transform="rotate(285)"/><path d="M0 -13 L0 -30" transform="rotate(300)"/><path d="M0 -13 L0 -30" transform="rotate(315)"/><path d="M0 -13 L0 -30" transform="rotate(330)"/><path d="M0 -13 L0 -30" transform="rotate(345)"/>
    </g>
  </g>
  <circle cx="32" cy="32" r="13" fill="url(#iris)" opacity="0.55"/>
  <circle cx="32" cy="24" r="12" fill="url(#glow)"/>
  <!-- scale: pillar + base -->
  <rect x="30.5" y="22" width="3" height="24" rx="1.5" fill="url(#gold)"/>
  <path d="M21 47 h22" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- beam -->
  <path d="M13 22 L51 22" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="22" r="3.4" fill="#fff7d6" stroke="#f59e0b" stroke-width="0.8"/>
  <!-- chains -->
  <path d="M14 22 l-4.5 12 M14 22 l4.5 12" stroke="#ffe08a" stroke-width="1.2"/>
  <path d="M50 22 l-4.5 12 M50 22 l4.5 12" stroke="#ffe08a" stroke-width="1.2"/>
  <!-- pans -->
  <path d="M7.5 34 a6.5 3.2 0 0 0 13 0 z" fill="url(#gold)"/>
  <path d="M43.5 34 a6.5 3.2 0 0 0 13 0 z" fill="url(#gold)"/>
  <!-- highlight + rim -->
  <ellipse cx="23" cy="15" rx="9" ry="4.5" fill="#ffffff" opacity="0.28" transform="rotate(-25 23 15)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#062a4d" stroke-width="1.5" opacity="0.7"/>
</svg>
